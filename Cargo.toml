[package]
name = "riot-fast-login"
version = "1.0.0"
edition = "2021"
authors = ["Bahaa"]
description = "Ultra-fast, native Win32 OLED Dark Mode fast login & account switcher for Riot Games (League of Legends, VALORANT, TFT) with instant session swapping and zero 2FA prompts."
license = "MIT"
readme = "README.md"
keywords = ["riot-games", "league-of-legends", "valorant", "account-switcher", "win32"]
categories = ["games", "gui"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
